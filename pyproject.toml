[project]
name = "finsight-ai"
version = "0.1.0"
description = "Enterprise Financial Research & Risk Intelligence Copilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "numpy>=2.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=3.1,<4.0",
    "sqlglot>=26.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "redis>=5.0,<8.0",
    "pymilvus>=2.5.16,<2.6",
    "httpx>=0.27,<1",
    "pyjwt>=2.10,<3.0",
    "pwdlib[argon2]>=0.3,<1.0",
    "mcp>=2,<3",
]

[project.optional-dependencies]
embedding = [
    "FlagEmbedding>=1.4.2,<2.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
